name: Windows release build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc-x64
      - name: Build release (two CPU jobs, no app launch or tests)
        run: cmake --build --preset windows-msvc-x64-release --target TaikoKeyWASAPI
      - name: Package ZIP and checksum
        id: package
        shell: pwsh
        run: ./tools/package-release.ps1 -BuildDirectory build/msvc
      - name: Check tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if ($env:TAG_NAME -ne "v$env:APP_VERSION") { throw 'Tag and app version differ' }
      - uses: actions/upload-artifact@v4
        with:
          name: TaikoKeyWASAPI-${{ steps.package.outputs.version }}-windows-x64
          path: dist/releases/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TaikoKeyWASAPI-${{ needs.build.outputs.version }}-windows-x64
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* --verify-tag --draft --title "Taiko Key WASAPI $TAG_NAME" --notes-file .github/RELEASE_NOTES.md
